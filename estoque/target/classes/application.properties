spring.application.name=estoque
server.port=8080

# Pasta onde o banco fica salvo. Caminho FIXO (não depende de onde a aplicação foi iniciada),
# para os dados continuarem lá mesmo se a aplicação cair e for aberta de outra pasta.
# Para usar outra pasta, defina a variável de ambiente ESTOQUE_BANCO_PASTA.
estoque.banco.pasta=${user.home}/estoque-data

# Banco H2 em arquivo. WRITE_DELAY=0 grava cada alteração no disco na hora
# (o padrão do H2 espera até 0,5 s, e uma queda nesse intervalo perderia o último cadastro).
spring.datasource.url=jdbc:h2:file:${estoque.banco.pasta}/estoque;AUTO_SERVER=TRUE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria as tabelas se não existirem e NUNCA apaga os dados existentes
# (não troque para "create" ou "create-drop", que apagam tudo ao iniciar)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web do banco: http://localhost:8080/h2-console (use só em ambiente local)
spring.h2.console.enabled=true
